[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "navkit"
version = "0.2.0"
description = "Replay, evaluation and uncertainty calibration for GNSS-denied navigation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Telschow" }]
keywords = [
    "navigation",
    "kalman-filter",
    "state-estimation",
    "uncertainty-calibration",
    "gnss-denied",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# B2 was that no lint or typecheck gate could be run outside CI. The two
# tools are here so `uv run ruff check` and `uv run mypy src` work locally and
# resolve to the same versions the CI job installs, which are unpinned there.
dev = ["pytest>=7.4", "hypothesis>=6.100", "pre-commit>=3.7", "ruff==0.16.9", "mypy==2.3.1"]
# The documentation site. Pinned exactly so the site builds the same way everywhere; MkDocs is held
# below 2.0, which removes the plugin system the site uses.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
    "mkdocs-include-markdown-plugin==7.3.0",
]

[project.scripts]
navkit = "navkit.cli:main"

[project.urls]
Homepage = "https://github.com/Telschow/contested-nav"
Issues = "https://github.com/Telschow/contested-nav/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/navkit"]

# The default scenario file is shipped inside the wheel, so `navkit run` works from any
# directory. The repository copy stays the single source: this copies it at build time.
[tool.hatch.build.targets.wheel.force-include]
"configs/benchmark.yaml" = "navkit/configs/benchmark.yaml"

# The lint rule set is declared rather than inherited.
#
# `ruff check` with no configuration selects whatever ruff's defaults are that
# month, so the gate moved from 14 to 131 findings as upstream shipped new rules
# -- and a gate that fails for reasons unrelated to the code trains everyone to
# ignore it. Pinning the selection makes the standard a property of this
# repository. The set below is deliberately explicit: correctness and
# import-hygiene rules, plus the readability rules that catch real defects
# (PLR0124, SIM222, RUF007). Style-only rules the formatter does not enforce
# are left out on purpose.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, redefinitions, unused locals
    "I",    # import sorting
    "UP",   # pyupgrade: modern syntax for the declared minimum, 3.11
    "B",    # bugbear: mutable defaults, shadowing, loop pitfalls
    "C4",   # comprehensions
    "SIM",  # simplifications that are not merely taste
    "RUF",  # ruff-specific correctness and modernisation
]
# Sigma is the notation of this project's subject (NEES, "2σ coverage") and
# appears in plot labels, so it is allowed rather than rewritten as "o".
allowed-confusables = ["σ"]
ignore = [
    # Implicit string concatenation inside a collection literal is how long
    # prose messages are wrapped in this codebase, and it is readable.
    "ISC001",
    "ISC002",
    "ISC003",
    # `__all__` is kept in a deliberate, documented order rather than sorted:
    # the constants read as a state machine, and the order carries meaning.
    "RUF022",
    # `int(x)` on a value already known to be integral documents the type
    # transition at the boundary of the JSON/YAML config layer.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and re-export names deliberately, and build helper
# scripts manipulate sys.path before importing the package.
"tests/*" = ["E402", "F401"]
"scripts/*" = ["E402"]
# `__init__.py` re-exports define the public API and are not "unused".
"src/navkit/**/__init__.py" = ["F401"]
# The HTML table rows below are one line per row on purpose. Wrapping a `<tr>`
# across lines makes the rendered-table structure harder to check by eye, and
# these are the exact strings `check_doc_tables.py` matches against the docs.
"tests/test_doc_tables.py" = ["E501"]
# `as_markdown` builds a Markdown table whose header says "Coverage @2sigma" and
# whose cells use an en dash as a range separator. Both are intended typography,
# and substituting the ASCII lookalikes would be a real regression in the output.
"src/navkit/seed_sweep.py" = ["RUF001"]
# Same Markdown-table typography as the seed sweep: "Coverage @2sigma" and an
# en-dash range separator are intended, not typos.
"src/navkit/scene_sweep.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["navkit"]

[tool.mypy]
# numpy and matplotlib do not ship complete stubs; `--ignore-missing-imports`
# is in the CI command too, and duplicating it here means a bare `mypy src`
# behaves the same as the gate.
#
# 3.13 matches the interpreter the CI lint job runs on. Setting the declared
# minimum of 3.11 instead makes mypy reject numpy's own stubs, which use `type`
# statements, so the gate could not check the code it was written to check.
python_version = "3.13"
warn_unused_configs = true
# No error codes are suppressed. The filter state used to need
# `assignment`, `dict-item`, and `union-attr` silenced because it was annotated
# `dict[str, np.ndarray]` while holding ints, a bool, and a None; it is now a
# TypedDict, so the silencer is gone rather than narrowed.

[tool.pytest.ini_options]
# Tests run against the source tree with no install step, so a fresh clone needs
# only `pytest`. This also keeps the suite independent of build-backend state.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::RuntimeWarning"]
