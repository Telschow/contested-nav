name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Tells the heavy jobs whether a pull request changed anything but prose. A pull request that
    # touches only Markdown pages and figures under docs/ skips them. This is a job and not a
    # workflow-level path filter: a filtered workflow never reports its checks, and a check that
    # never reports is waited on forever. The jobs below report "skipped" instead, and the matrix
    # jobs skip their steps, because a matrix job skipped as a whole never expands its check names.
    # Pushes to main and manual runs always count as code.
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            # Docs-only means every changed path is a Markdown page or a figure under docs/, or a Markdown
            # file at the root. The four pages that carry generated benchmark tables are checked against a
            # fresh benchmark by the benchmark job, so a change to them counts as code. An empty diff counts
            # as code too, so a mistake here runs more jobs, never fewer.
            if [ -n "$files" ] \
               && ! echo "$files" | grep -Evq '^(docs/.*\.md|docs/figures/.*|[^/]+\.md)$' \
               && ! echo "$files" | grep -Eq '^(README\.md|docs/index\.md|docs/results\.md|docs/getting-started\.md)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        # The floor is the declared minimum in pyproject.toml. Testing only the
        # newest interpreter would let a 3.11 incompatibility ship unnoticed, and
        # the upper bound is included because that is where new breakage appears.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        # The 3.13 leg runs the suite under the coverage tracer in the next step, so it does not run it twice.
        if: needs.changes.outputs.code == 'true' && matrix.python-version != '3.13'
        run: python -m pytest -q

      - name: Coverage ratchet
        # This step is the test run of the 3.13 leg. Fails if any module drops below its floor, or if
        # total coverage drops.
        if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.13'
        # The point is to make coverage regression a build failure rather than
        # something a reviewer has to notice in a diff.
        # `--ratchet` is what makes this a gate. Without it the script reports
        # coverage and always exits 0, so the step was named "Coverage ratchet"
        # while being incapable of failing a build.
        run: python scripts/coverage_report.py --ratchet

      - name: Coverage matches the recorded figure
        # Compared only on the interpreter the JSON was measured on, because the
        # executable-line count depends on the bytecode. See scripts/metrics.py.
        if: needs.changes.outputs.code == 'true' && matrix.python-version == '3.13'
        run: python scripts/metrics.py --check-coverage

  test-os:
    # The Linux matrix above is the full gate. These legs run the same suite on the
    # other two desktop platforms at one interpreter, to find platform dependence in
    # the maths rather than to repeat the interpreter matrix. The golden snapshot is
    # compared with a tolerance (see tests/test_golden_benchmark.py), which is the
    # documented policy for last-bit differences between platforms.
    name: test (py3.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # Installed with the `.[dev]` extra so CI resolves the same pinned
      # versions as a developer running `uv run ruff check` locally. Bare
      # `pip install ruff mypy` took whatever was newest that day, which made
      # the gate's result depend on the calendar: it went from 14 findings to
      # 131 across one release, with no change to this repository.
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests scripts
      - name: ruff format --check
        run: ruff format --check src tests scripts
      - name: mypy
        # Untyped third-party stubs are expected here: NumPy and Matplotlib do
        # not ship complete ones, and silencing that is the point of the flag
        # rather than a workaround.
        #
        # No error codes are suppressed in pyproject.toml, so every error
        # reported here is a real one. That was not true before: three codes
        # were disabled in the config and the job could not see the 12 errors
        # they were hiding.
        run: mypy src --ignore-missing-imports
      - name: SRS traceability
        # Every requirement and acceptance criterion in the SRS has a test, a checked configuration
        # value or a declared gap, and the roll-up counts follow from the verdicts. Structural only.
        run: python scripts/check_srs_trace.py

      - name: Quoted counts
        # The test, ADR and coverage figures in the documents are quoted from
        # docs/data/metrics.json through metric markers. This fails when a document
        # or the JSON is stale, or when a count is typed by hand. Collecting the
        # tests takes a second; the coverage comparison runs in the test job.
        run: python scripts/metrics.py --check

      - name: Documentation tests
        # A documentation-only pull request skips the test jobs, so the tests that read the documents run here
        # instead: the framing and owner guards, the quoted counts, the risk register, the link checker, the secret
        # scan of the documents and every page that is generated from a committed CSV. Any other pull request
        # runs them in the test jobs. tests/test_ci_docs_tests.py fails when a test that reads a page is missing
        # from this list; test_doc_tables.py is left out on purpose (see that file).
        if: needs.changes.outputs.code != 'true'
        run: >
          python -m pytest -q tests/test_framing.py tests/test_no_invented_owners.py tests/test_quoted_metrics.py
          tests/test_risks_doc.py tests/test_check_links.py tests/test_srs_trace.py tests/test_model_doc.py
          tests/test_scenarios_doc.py tests/test_scan_secrets.py tests/test_attribution_page.py
          tests/test_euroc_page.py tests/test_fault_classification_page.py tests/test_fault_matrix.py
          tests/test_mismatch_sweep.py tests/test_multipath.py tests/test_rice.py tests/test_separability_page.py
          tests/test_slow_ramp_page.py tests/test_timing_page.py tests/test_tumvi_page.py
          tests/test_urbannav_check.py tests/test_vision_ramp_page.py tests/test_vo_page.py
          tests/test_quoted_numbers.py tests/test_urbannav_run.py tests/test_ensemble_page.py
          tests/test_b1_gate_page.py tests/test_b1_gate_heldout_page.py tests/test_ess_page.py tests/test_verdict_prose.py tests/test_candidate_gate_page.py tests/test_fdir_false_alarm_page.py
          tests/test_scale_tuning_page.py tests/test_gm_tuning_page.py tests/test_front_page_claims.py tests/test_mismatch_ensemble_page.py

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the wheel installs and imports in a clean env
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --upgrade pip
          /tmp/verify/bin/python -m pip install dist/*.whl
          # Importing is the actual test: a wheel that builds but cannot be
          # imported is a packaging bug the build step alone will not catch.
          /tmp/verify/bin/python -c "import navkit; print(navkit.__version__)"
      - name: Check the installed command works from another directory
        # The default scenario file is copied into the wheel at build time. Running one
        # case from a directory that is not the repository proves the entry point and
        # the packaged file, which the source-tree tests cannot.
        run: |
          cd /tmp
          /tmp/verify/bin/navkit --version
          /tmp/verify/bin/navkit run --list
          /tmp/verify/bin/navkit run --only gnss_only --out /tmp/verify_gnss.json
          /tmp/verify/bin/navkit sweep seeds --seeds 2 --only gnss_only --out /tmp/verify_seeds.json
          /tmp/verify/bin/navkit sweep scenes --seeds 2 --only gnss_only --out /tmp/verify_scenes.json
          /tmp/verify/bin/navkit sweep outages --seeds 2 --cases outage_control --starts 5 --durations 5 --out /tmp/verify_outages.json
          /tmp/verify/bin/navkit figures --results /tmp/verify_gnss.json

  docs:
    # The documentation site must build with warnings as errors: a broken link, a missing page or a
    # docstring the API reference cannot read fails here, not on the published site.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict

  container:
    # Proves the Dockerfile and the devcontainer that reuses it still build, and that the
    # image can run the CLI and a fast slice of the suite. The full suite already runs in
    # the test jobs; this checks the packaging, not the numerics.
    name: container
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t navkit .
      - name: Run the CLI and a fast test slice in it
        run: |
          docker run --rm navkit navkit --version
          docker run --rm navkit navkit run --list
          docker run --rm navkit python -m pytest -q tests/test_cli.py tests/test_synthetic_imu.py

  benchmark:
    name: benchmark reproducibility
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run the benchmark twice and require identical output
        # The benchmark is only evidence if it is reproducible. Running it twice
        # and diffing the two result files is the cheapest way to catch an
        # unseeded random draw, which would otherwise make every quoted number
        # unreproducible while still looking plausible.
        run: |
          python scripts/run_benchmark.py --out /tmp/run1.json
          python scripts/run_benchmark.py --out /tmp/run2.json
          python - <<'PY'
          import json, sys

          # Wall-clock derived values, stripped wherever they appear. These are
          # measurements of how fast the machine ran the filter, not
          # measurements of the filter, so they are expected to differ between
          # runs. They show up in more than one place (top level, `stats` and
          # `summary`), hence the recursive walk rather than a fixed key list.
          TIMING_KEYS = frozenset({"runtime_s", "wall_s", "realtime_factor"})

          def strip(node):
              if isinstance(node, dict):
                  return {k: strip(v) for k, v in node.items() if k not in TIMING_KEYS}
              if isinstance(node, list):
                  return [strip(v) for v in node]
              return node

          def norm(path):
              return json.dumps(strip(json.load(open(path))), sort_keys=True)

          if norm("/tmp/run1.json") != norm("/tmp/run2.json"):
              print("benchmark is NOT reproducible across runs")
              sys.exit(1)
          print("benchmark is reproducible")
          PY
      - name: Check the documented tables against the generated benchmark
        # README.md and docs/results.md both claim their numbers are generated
        # rather than typed. This is what makes that claim testable: the
        # benchmark is regenerated here, then every numeric cell of both tables
        # is compared against it. Without this step a re-run that moves a number
        # would leave the prose describing the old one, and nothing else fails.
        run: |
          python scripts/run_benchmark.py --out /tmp/bench.json
          python scripts/check_doc_tables.py --results /tmp/bench.json

  sweeps:
    name: sweep reproducibility
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    # Three seeds, not ten. This job exists to catch an unseeded draw or a
    # broken sweep, not to regenerate the published distributions -- those take
    # minutes and their results are committed under results/, which is
    # gitignored. A full 8- or 10-scene run here would triple CI time to check
    # something the unit tests already cover.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: The sweeps run twice and must agree
        # The two sweeps vary different axes -- sensor noise and trajectory --
        # so a silent unseeded draw in either would make a published spread
        # unreproducible while still looking plausible. Two runs and a diff
        # catches that for the price of one extra sweep.
        run: |
          for script in seed_sweep scene_sweep; do
            python scripts/$script.py --seeds 3 --out /tmp/${script}_1.json
            python scripts/$script.py --seeds 3 --out /tmp/${script}_2.json
          done
          # The outage sweep runs a reduced grid: one start, two durations, two seeds.
          for n in 1 2; do
            python scripts/outage_sweep.py --seeds 2 --starts 5 --durations 5 10 --out /tmp/outage_sweep_$n.json
          done
          # So does the mismatch sweep: one case, two factors, two seeds.
          for n in 1 2; do
            python scripts/mismatch_sweep.py --cases gnss_only --scales 0.5 1 --seeds 2 --out /tmp/mismatch_sweep_$n.json
          done
          # And the fault matrix: two faults, two seeds.
          for n in 1 2; do
            python scripts/fault_matrix.py --faults gnss_spoof_sustained imu_sample_loss --seeds 2 --out /tmp/fault_matrix_$n.json
          done
          python - <<'PY'
          import json, sys

          # wall_s is a measurement of this machine, not of the filter.
          TIMING_KEYS = frozenset({"wall_s", "runtime_s", "realtime_factor"})

          def strip(node):
              if isinstance(node, dict):
                  return {k: strip(v) for k, v in node.items() if k not in TIMING_KEYS}
              if isinstance(node, list):
                  return [strip(v) for v in node]
              return node

          def norm(path):
              return json.dumps(strip(json.load(open(path))), sort_keys=True)

          failed = []
          for name in ("seed_sweep", "scene_sweep", "outage_sweep", "mismatch_sweep", "fault_matrix"):
              a, b = f"/tmp/{name}_1.json", f"/tmp/{name}_2.json"
              if norm(a) != norm(b):
                  failed.append(name)
          if failed:
              print("NOT reproducible across runs: " + ", ".join(failed))
              sys.exit(1)
          print("all five sweeps are reproducible")
          PY

      - name: The committed mismatch result matches a fresh run
        # docs/mismatch.md is generated from docs/data/mismatch_sweep.csv, and its prose is
        # tested against that file. This reruns the default grid and fails if the file no
        # longer matches, so a change that moves the result cannot leave the page describing
        # the old one. Numbers are compared to 1e-6 relative, as in ADR-0009.
        run: python scripts/mismatch_sweep.py --out /tmp/mismatch_full.json --compare docs/data/mismatch_sweep.csv

      - name: The committed fault matrix matches a fresh run
        # Same idea for docs/faults.md and docs/data/fault_matrix.csv.
        run: python scripts/fault_matrix.py --out /tmp/fault_full.json --compare docs/data/fault_matrix.csv

      - name: The committed FDIR false-alarm and sensitivity CSVs match a fresh reduced run
        # docs/faults.md has two generated blocks from docs/data/fdir_false_alarm.csv and docs/data/fdir_sensitivity.csv.
        # The full grids take several minutes, so this runs a reduced one twice and compares it with the committed files:
        # the false-alarm rate on seeds 0 to 2 (the per-seed rows are compared, the pooled rows only when the seeds
        # match) and the sensitivity sweep on one fault and one constant at the full five seeds. The two runs must
        # also agree byte for byte. Numbers are compared to 1e-6 relative, as in ADR-0009.
        run: |
          for n in 1 2; do
            python scripts/fdir_false_alarm.py rate --seeds 3 --csv /tmp/fdir_rate_$n.csv --compare docs/data/fdir_false_alarm.csv
            python scripts/fdir_false_alarm.py sensitivity --faults gnss_spoof_sustained --constants reacq_sigma_m --csv /tmp/fdir_sens_$n.csv --compare docs/data/fdir_sensitivity.csv
          done
          cmp /tmp/fdir_rate_1.csv /tmp/fdir_rate_2.csv
          cmp /tmp/fdir_sens_1.csv /tmp/fdir_sens_2.csv

  ensemble:
    name: ensemble reproducibility
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    # One run of the 25-seed ensemble, in parallel with the other jobs. docs/calibration.md is generated from
    # docs/data/ensemble_nees.csv and tested against it; this fails if the file no longer matches a fresh run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: The committed ensemble matches a fresh run
        # Text and integers must match exactly. Floats are compared to 1e-6 relative, as in ADR-0009, because
        # the runner is not the machine that wrote the file and the last digits of a float can differ across platforms.
        run: |
          python scripts/seed_sweep.py --seeds 25 --out /tmp/ensemble_sweep.json \
            --ensemble-compare docs/data/ensemble_nees.csv \
            --ess-compare docs/data/effective_sample_size.csv

      - name: The committed development gate matches a fresh run
        # The B1 gate of ADR-0028 on the development seeds 0 to 24, once. Never the held-out seeds 100 to 124: they
        # are single use. The same comparison as above: text, integers and flags exactly, floats to 1e-6 relative.
        run: |
          navkit gate b1 --seeds 0-24 --csv /tmp/b1_gate_dev.csv
          python - <<'PY'
          import math
          from pathlib import Path
          from navkit import b1_gate

          new = b1_gate.parse_csv(Path("/tmp/b1_gate_dev.csv").read_text(encoding="utf-8"))
          old = b1_gate.parse_csv(Path("docs/data/b1_gate_dev.csv").read_text(encoding="utf-8"))
          problems = [] if len(new) == len(old) else [f"{len(new)} rows against {len(old)}"]
          for a, b in zip(new, old, strict=False):
              for key in b1_gate.CSV_FIELDS:
                  x, y = a[key], b[key]
                  same = math.isclose(x, y, rel_tol=1e-6, abs_tol=1e-12) if isinstance(x, float) else x == y
                  if not same:
                      problems.append(f"{a['subject']} {a['condition']} {key}: {x!r} against {y!r}")
          print("\n".join(problems) or "the development gate matches docs/data/b1_gate_dev.csv")
          raise SystemExit(1 if problems else 0)
          PY

      - name: The committed candidate gate (development seeds) and its n_eff pool match a fresh run
        # The gate of ADR-0030 on the development seeds 25 to 49 in two scenarios, and the pool of effective sample
        # sizes (seeds 25 to 99) that its simulated properties draw from. Held-out blocks (from seed 125) are
        # never run here: the command refuses them without --held-out, and CI does not pass it. Text, integers and
        # flags must match exactly; floats to 1e-6 relative.
        run: |
          navkit gate n-eff-pool --csv /tmp/gate_n_eff_pool.csv --compare docs/data/gate_n_eff_pool.csv
          navkit gate candidate --seeds 25-49 --csv /tmp/candidate_gate_dev.csv --compare docs/data/candidate_gate_dev.csv
