# Reproducible benchmark definition for the 21-state ESKF.
#
# Every scenario here is synthetic. The reference is the analytic trajectory
# the generator is built from, so ground truth is exact rather than another
# estimate. Cases differ only in what is degraded, which is what makes them
# comparable: a difference in ATE between two cases is a difference in the
# scenario, not in the initial conditions.
#
# Run with:
#   python scripts/run_benchmark.py
#   python scripts/run_benchmark.py --list
#   python scripts/run_benchmark.py --only gnss_only outage_visual

defaults:
  synthetic:
    duration_s: 30.0
    rate_hz: 100.0
    radius_m: 4.0
    circles: 1.5
    sway_amplitude_m: 0.6
    sway_cycles: 3.0
    yaw_amplitude_deg: 35.0
    yaw_cycles: 1.0
    start_position: [1.0, 0.0, 1.6]

  estimator:
    # 1 re-commits the anchor pose at every visual update, so each measurement
    # compares consecutive frames. None holds a single anchor for the whole
    # run, which makes the anchor error one unknown shared by every measurement
    # and measures measurably worse (mean NEES 23 rather than 3).
    vision_keyframe_interval: 1
    vision_anchor_modelled: true
    rpe_delta_s: 1.0

cases:
  # --- controls -------------------------------------------------------------

  gnss_only:
    name: gnss_only
    description: >-
      GNSS at 5 Hz, no outage, no vision. The reference every other case is read
      against. Its verdict is mixed rather than clean: mean NEES sits slightly
      above the expected value while no epoch leaves the 2-sigma ellipsoid.
    scenario:
      name: gnss_only
      description: GNSS only, nominal noise.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0

  dead_reckoning:
    name: dead_reckoning
    description: >-
      Inertial integration with no aiding at all. Reported as the control for
      "how much of the result is the filter and how much is the motion model".
    estimator:
      class: DeadReckoning
    scenario:
      name: dead_reckoning
      description: No aiding whatsoever.
      gnss:
        enabled: false
        seed: 0

  # --- the defect this refactor fixed ---------------------------------------
  #
  # vision_anchor_modelled: false puts the anchor error back into the R matrix as
  # if it were measurement noise. It is wrong, and it is kept only so the
  # failure can be reproduced on demand: the number it produces is the evidence
  # for modelling the anchor as filter state instead.

  vision_anchor_in_measurement_noise:
    name: vision_anchor_in_measurement_noise
    description: >-
      The pre-refactor arrangement, where the visual anchor error is folded into
      the measurement covariance. Retained as a regression control, not as a
      supported configuration.
    estimator:
      vision_fuse: true
      vision_anchor_modelled: false
    scenario:
      name: vision_anchor_in_measurement_noise
      description: Anchor error in R rather than in filter state (incorrect).
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0

  # --- visual only ----------------------------------------------------------

  vision_only:
    name: vision_only
    description: >-
      Visual odometry at 20 Hz with no GNSS. In this fixture it is less accurate
      than dead reckoning and severely overconfident: nothing constrains the
      absolute pose, and the claimed uncertainty is far smaller than the error.
    estimator:
      vision_fuse: true
    scenario:
      name: vision_only
      description: Visual odometry, no GNSS.
      gnss:
        enabled: false
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0

  # --- the case this project is about ---------------------------------------

  outage_control:
    name: outage_control
    description: >-
      15 s GNSS outage, 5 s to 20 s, with vision off. The baseline for a contested
      receiver: the error grows and so does the claimed uncertainty, and coverage
      stays at or above nominal. The verdict is mixed because mean NEES is slightly
      above the expected value.
    estimator:
      vision_fuse: false
    scenario:
      name: outage_control
      description: GNSS outage with no visual aiding.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  outage_visual:
    name: outage_visual
    description: >-
      The same 15 s outage with vision on. Position error is lower than the
      control in this window, but the claimed uncertainty stays small and coverage
      collapses: accurate and confidently wrong. That is why vision_enabled
      defaults to false. The accuracy gain depends on when the outage starts
      (see the outage sweep); the overconfidence does not.
    estimator:
      vision_fuse: true
    scenario:
      name: outage_visual
      description: GNSS outage with visual aiding, 21-state anchor.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  # --- degraded front end ---------------------------------------------------

  outage_visual_degraded_camera:
    name: outage_visual_degraded_camera
    description: >-
      Visual aiding through the outage with 30% of camera frames dropped in 1 s
      bursts. Checks whether an intermittent visual stream changes the result. It
      does not: the filter is still overconfident, with a smaller error than the
      clean case.
    estimator:
      vision_fuse: true
    scenario:
      name: outage_visual_degraded_camera
      description: 30% camera drop, burst period 1 s.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested
      camera_drop:
        drop_fraction: 0.3
        burst_period_s: 1.0
        seed: 3

  # --- the stochastic clone (blocker B1 spike, ADR-0017) -----------------------
  #
  # The cases above stay as they are: the single-anchor model is the control that motivated this work, and
  # deleting its numbers would delete the evidence that the work mattered. The cases below run the same
  # scenarios with vision_model: clone. The degraded-camera pair also sets vision.rereference, because the
  # generator otherwise measures against a dropped frame, which no filter that compares with its last
  # received frame can be consistent with.

  outage_visual_clone:
    name: outage_visual_clone
    description: >-
      The outage_visual scenario with the previous visual pose carried as a stochastic
      clone instead of a stored anchor. Same data, same seeds, same gate.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: outage_visual_clone
      description: GNSS outage with visual aiding, stochastic clone.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  outage_visual_degraded_camera_rereferenced:
    name: outage_visual_degraded_camera_rereferenced
    description: >-
      The degraded-camera scenario with every delivered measurement taken against the last
      delivered frame, and the single-anchor model. Separates the effect of the generator
      from the effect of the clone: the anchor is no better calibrated.
    estimator:
      vision_fuse: true
    scenario:
      name: outage_visual_degraded_camera_rereferenced
      description: 30% camera drop, burst period 1 s, re-referenced; anchor model.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        rereference: true
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested
      camera_drop:
        drop_fraction: 0.3
        burst_period_s: 1.0
        seed: 3

  outage_visual_degraded_camera_clone:
    name: outage_visual_degraded_camera_clone
    description: >-
      The degraded-camera scenario with re-referenced measurements and the stochastic clone.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: outage_visual_degraded_camera_clone
      description: 30% camera drop, burst period 1 s, re-referenced; stochastic clone.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        rereference: true
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested
      camera_drop:
        drop_fraction: 0.3
        burst_period_s: 1.0
        seed: 3

  vision_only_clone:
    name: vision_only_clone
    description: >-
      Visual odometry at 20 Hz with no GNSS, with the stochastic clone. Nothing constrains the
      absolute pose, so the claimed uncertainty has to grow with the error and not stay small.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: vision_only_clone
      description: Visual odometry, no GNSS, stochastic clone.
      gnss:
        enabled: false
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0

  # --- stress tests of the clone (ADR-0017) -----------------------------------
  #
  # The visual surrogate is otherwise independent, Gaussian and unbiased. These cases depart from that one way at
  # a time, with the clone. They exist so that what the clone does not survive is pinned as well as what it does.

  outage_visual_clone_outliers:
    name: outage_visual_clone_outliers
    description: >-
      The clone with 5% of visual frames carrying an error twenty times the nominal one, as
      with a wrong feature match. The chi-square gate rejects them and the filter stays calibrated.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: outage_visual_clone_outliers
      description: Stochastic clone, 5% gross outliers.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        outlier_fraction: 0.05
        outlier_scale: 20.0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  outage_visual_clone_scale_drift:
    name: outage_visual_clone_scale_drift
    description: >-
      The clone with a slowly drifting error of up to 10% on the translation scale, as monocular
      scale drifts. The inertial unit holds the metric scale, so the filter stays calibrated.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: outage_visual_clone_scale_drift
      description: Stochastic clone, drifting translation scale.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        scale_sigma: 0.10
        scale_tau_s: 30.0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  outage_visual_clone_correlated:
    name: outage_visual_clone_correlated
    description: >-
      The clone with visual errors correlated over 2 s, as they are when consecutive frames share
      features. The clone assumes independent errors, so it is overconfident again. This is the
      case the clone does not survive.
    estimator:
      vision_fuse: true
      vision_model: clone
    scenario:
      name: outage_visual_clone_correlated
      description: Stochastic clone, errors correlated over 2 s.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        noise_corr_s: 2.0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested

  outage_visual_clone_correlated_inflated:
    name: outage_visual_clone_correlated_inflated
    description: >-
      The same correlated errors with the filter told the visual noise is four times larger than the
      generator drew. Calibration is restored, at a cost in accuracy that still leaves the position error
      well inside the no-vision control's.
    estimator:
      vision_fuse: true
      vision_model: clone
      vision_sigma_scale: 4.0
    scenario:
      name: outage_visual_clone_correlated_inflated
      description: Stochastic clone, errors correlated over 2 s, visual noise inflated.
      gnss:
        enabled: true
        rate_hz: 5.0
        sigma_m: 0.8
        seed: 0
      vision:
        enabled: true
        rate_hz: 20.0
        rot_sigma_deg: 0.35
        trans_sigma_m: 0.05
        seed: 0
        noise_corr_s: 2.0
      gnss_outages:
        - start_s: 5.0
          duration_s: 15.0
          reason: contested
